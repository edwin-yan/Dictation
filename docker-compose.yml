version: '3.8'

services:
  dictation-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spelling_dictation_app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////app/data/dictation.db
    volumes:
      # Local volume persistence for SQLite database & audio cache across upgrades
      - ./data:/app/data
