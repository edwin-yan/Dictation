{% extends "base.html" %}

{% block title %}Admin Login - Spelling Dictation{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card" style="padding: 2.5rem 2rem; text-align: center;">
        <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🔒</div>
        <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Administrator Access</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.75rem;">
            Enter the admin password to manage students, lists, assignments, and view test records.
        </p>

        <form method="POST" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
            <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password..."
                        autofocus
                        required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                Unlock Admin Portal ➜
            </button>
        </form>

        <div style="margin-top: 1.5rem;">
            <a href="{{ url_for('student.dashboard') }}" style="font-size: 0.875rem; color: var(--slate-500);">
                ← Return to Student Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
